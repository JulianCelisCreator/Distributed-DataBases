services:
  patasana:
    image: postgres:18
    container_name: patasana
    env_file: .env
    # Las citas, CURRENT_DATE y now() dependen de la hora local, no de UTC
    command: >
      postgres
      -c timezone=America/Bogota
      -c log_timezone=America/Bogota
    volumes:
      - datos-patasana:/var/lib/postgresql
      # Se ejecutan en orden alfabético, solo con el volumen vacío
      - ./DDL.sql:/docker-entrypoint-initdb.d/01-DDL.sql:ro
      - ./DML.sql:/docker-entrypoint-initdb.d/02-DML.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      # -h 127.0.0.1: el servidor temporal de la inicialización no escucha por TCP,
      # así que solo responde cuando DDL y DML ya terminaron
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  datos-patasana:
